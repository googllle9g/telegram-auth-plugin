language: "en"

telegram:
  # Get a token from @BotFather
  bot-token: "PUT_YOUR_BOT_TOKEN_HERE"
  bot-username: "PUT_YOUR_BOT_USERNAME_HERE"
  # Telegram user IDs allowed to use the /admin panel in the bot (search/view/unlink/ban/etc).
  # This is only needed for admins who AREN'T linking their own Minecraft account: anyone whose
  # linked account has the tgauth.admin permission (or OP, if offline) gets panel access
  # automatically. Get your own numeric ID from a bot like @userinfobot. Example: [123456789]
  admin-ids: []
  # Master switch for the /admin panel in the bot. Set to false to disable it entirely,
  # regardless of admin-ids or the tgauth.admin permission.
  admin-panel-enabled: true

auth:
  # How long (seconds) a /link code stays valid.
  code-expire-seconds: 300
  # How long (seconds) a login-confirmation request (Confirm/Reject buttons) stays valid.
  confirm-timeout-seconds: 90
  # How long (seconds) a player has to finish authorization (link or confirm) before being kicked.
  auth-timeout-seconds: 120
  # Send a reminder message with the code every X seconds while the player waits to link.
  reminder-interval-seconds: 20
  # Apply blindness/slowness effects to unauthenticated players so they can't see/move around.
  apply-blindness: true
  apply-slowness: true

  # If a player's account isn't found under their current UUID, but a linked account exists
  # under a different UUID with the exact same (case-insensitive) username, automatically
  # re-point that link (and migrate inventory/OP - see PlayerDataMigrator) to the new UUID
  # instead of asking for a fresh /link.
  #
  # Requires FastLogin's own premiumUuid: true AND secondAttemptCracked: true settings to work
  # correctly and safely - see the FastLogin integration section of README.md. With those set,
  # FastLogin permanently marks a username as cracked the first time it fails Mojang
  # verification, so a squatted username can't later inherit the real owner's connection - the
  # real owner just gets the same UUID as the squatter, nothing to migrate. Run /tgauth
  # fastlogin to check these FastLogin settings.
  migrate-link-by-username: true

  # When migrating (see above), if the new UUID already has playerdata/advancements/stats
  # files on disk, overwrite them anyway. Safe on a fresh server (or one where TgAuth/FastLogin
  # were set up from day one) since a migration only ever targets a UUID being recognised as
  # premium for the first time. Turn off if you added this setup to an already-running server
  # where players already had real progress under their own premium UUIDs before.
  migration-overwrite-existing-data: true

  # If set above 0, a cracked/offline account that successfully confirms a login via Telegram
  # is trusted from that exact IP for this many seconds - reconnecting from the same IP within
  # that window skips the Confirm/Reject request entirely. Reconnecting from a DIFFERENT IP
  # still requires confirmation as normal, and immediately revokes the old trusted IP. If that
  # same IP is later used to log into a DIFFERENT account, the original account's trust is
  # revoked too. 0 disables this entirely.
  cracked-ip-cooldown-seconds: 0

fastlogin:
  # Master switch for FastLogin integration.
  enabled: true
  # If a player is verified premium and already linked to Telegram, skip the per-login
  # Confirm/Reject step and log them in immediately. Cracked/offline accounts always require
  # confirmation since their identity isn't cryptographically guaranteed.
  premium-skip-confirmation: true
  # How long to wait for FastLogin's async Mojang premium-check to answer before falling back
  # to sending a Telegram Confirm/Reject request.
  premium-check-wait-seconds: 4

storage:
  file: "database.db"

security:
  # Protects the /link <code> flow against brute-forcing the code (it's a 6-digit number,
  # ~900,000 possibilities). Limits how many WRONG /link attempts a single Telegram account
  # can make before being temporarily blocked.
  link-max-attempts: 5
  link-attempt-window-seconds: 60
  link-lockout-seconds: 300
  # Extra layer: if wrong /link guesses pile up across MANY different Telegram accounts within
  # a short window (a distributed brute-force attempt), lock out ALL /link attempts briefly.
  global-link-max-attempts: 20
  global-link-attempt-window-seconds: 60
  global-link-lockout-seconds: 120

# Console commands the /admin panel's Kick/Ban/Unban/Warn buttons run instead of TgAuth's own
# built-in Bukkit behavior (BanList, Player#kick, in-game chat message). Leave any of these
# blank to use the built-in behavior for that action. Set one if you use a dedicated
# punishment plugin (LiteBans, AdvancedBan, EssentialsX, etc.) so bans/warns go through its
# own storage/history/broadcast instead of TgAuth's own. Placeholders: %player% (username),
# %reason%, %duration% (ban only - whatever you typed in the bot: 1s/5m/2h/7d/p - make sure
# your command's duration format matches what your punishment plugin expects).
admin-commands:
  kick-command: ""
  ban-command: ""
  unban-command: ""
  # A "warn" here means running a command (e.g. a punishment plugin's own /warn), not sending
  # the player a chat message - set this if you want warns to go through that plugin instead of
  # TgAuth just messaging the player directly (the built-in default).
  warn-command: ""

